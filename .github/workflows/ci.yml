name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        mcp: ["mcp>=2", "mcp<2"]
        include:
          - os: macos-latest
            python: "3.12"
            mcp: "mcp>=2"
          - os: windows-latest
            python: "3.12"
            mcp: "mcp>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "${{ matrix.mcp }}"
      - run: python -m pytest -q

  render:
    name: test with JS rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,render]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs
